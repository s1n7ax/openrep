Categories:
  - Sports & Health
  - Workout
License: GPL-3.0-only
AuthorName: s1n7ax
SourceCode: https://github.com/s1n7ax/openrep
IssueTracker: https://github.com/s1n7ax/openrep/issues
Changelog: https://github.com/s1n7ax/openrep/blob/HEAD/CHANGELOG.md

AutoName: OpenRep

RepoType: git
Repo: https://github.com/s1n7ax/openrep.git

Builds:
  - versionName: 0.2.0
    versionCode: 200
    commit: v0.2.0
    subdir: android/app
    sudo:
      - apt-get update
      - curl -Lo node.tar.gz https://nodejs.org/dist/v22.23.4/node-v22.23.4-linux-x64.tar.gz
      - echo "b8492284c76a54baf58d61668dd0e41ee0fc98adabf9503d30f05d08f55b4406 node.tar.gz"
        | sha256sum -c -
      - tar xzf node.tar.gz --strip-components=1 -C /usr/local/
    init:
      - cd ../..
      - npm ci
      - npm run build
      - npx cap sync android
    gradle:
      - yes
    scandelete:
      - node_modules/

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
UpdateCheckData: fdroid/build-metadata.yml|\nCurrentVersionCode:\s*(\d+)||v(.+)
CurrentVersion: 0.2.0
CurrentVersionCode: 200
